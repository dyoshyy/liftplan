name: CI

# main への push は Deploy ワークフローがテストごと回すので、
# ここでは PR だけを見る。同じテストを二重に走らせない。
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres 実装のテストは実際の DB が要る。無いとスキップされ、
    # 「通った」と「走らせていない」が区別できなくなる。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: liftplan
          POSTGRES_USER: liftplan
          POSTGRES_DB: liftplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liftplan"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          TEST_DATABASE_URL: postgres://liftplan:liftplan@127.0.0.1:5432/liftplan
        run: go test -race ./...

      # スキップされていないことを確かめる。設定を消しても
      # テストは緑のままになるので、走ったこと自体を検査する。
      - name: Postgres のテストが実行されたことを確認
        env:
          TEST_DATABASE_URL: postgres://liftplan:liftplan@127.0.0.1:5432/liftplan
        run: |
          out=$(go test ./internal/infrastructure/postgres/ -run TestPostgres_SetLogSatisfiesTheContract -v)
          echo "$out"
          if echo "$out" | grep -q "SKIP"; then
            echo "Postgres のテストがスキップされている"
            exit 1
          fi

  # 画面の検査。サーバーとは別ジョブにする。
  # 片方が落ちたときに、どちらが壊れたのかがログを開かずに分かる。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: vitest
        run: pnpm test

      # ビルドが通ることまで見る。型が通ってもビルドが落ちる経路がある
      # （Service Worker の生成は tsc を通らない）。
      - name: build
        run: pnpm build
