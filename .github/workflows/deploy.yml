name: Deploy

# main に入ったものだけを出す。テストが通ってからでないと出さない。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時に走らせない。古いリビジョンが新しいものを上書きするのを防ぐ。
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: liftplan-85309
  # 画面のオリジンと API の場所は GitHub のリポジトリ変数から取る。
  # ここに直書きすると、URL が変わったときにコードの変更として出る。
  # 未設定なら下のジョブが落ちる（黙って既定値に落ちない）。
  ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
  # ログイン後の戻り先（画面）と、認可先に登録したコールバックの元（API 自身）。
  WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
  API_ORIGIN: ${{ vars.API_ORIGIN }}
  # クライアントIDは秘密ではない。シークレットだけ Secret Manager に置く。
  GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  API_BASE: ${{ vars.API_BASE }}
  REGION: asia-southeast1
  SERVICE: liftplan-server
  REPOSITORY: liftplan

jobs:
  # テストは CI と同じものを走らせる。デプロイの前提にするために
  # ここでも回す。CI の成功を当てにすると、CI が動いていない経路
  # （workflow_dispatch）で無検証のまま出てしまう。
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: liftplan
          POSTGRES_USER: liftplan
          POSTGRES_DB: liftplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liftplan"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        env:
          TEST_DATABASE_URL: postgres://liftplan:liftplan@127.0.0.1:5432/liftplan
        run: go test -race ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest

    # Workload Identity 連携に必要。サービスアカウントキーを
    # GitHub に置かないので、漏洩する鍵がそもそも存在しない。
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # main 以外から出させない。
      #
      # workflow_dispatch は ref を選んで実行できるので、push の
      # branches では止められない。ここで弾かないと、レビューを
      # 通っていないコードを本番に出せてしまう。
      #
      # Workload Identity 側も main に限定してあるので二重の守りだが、
      # あちらはリポジトリの設定から見えない。ここに書いておく。
      - name: main から出そうとしているか確かめる
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "main 以外からは出せない: ${GITHUB_REF}"
            exit 1
          fi

      # 未設定のまま出すと、サーバーは ALLOWED_ORIGINS 無しで起動を拒む。
      # 出してから気づくより、出す前に止めるほうが速い。
      - name: 許可オリジンが設定されているか確かめる
        run: |
          for v in WEB_ORIGIN API_ORIGIN GITHUB_CLIENT_ID GOOGLE_CLIENT_ID; do
            if [ -z "$(eval echo \"\$$v\")" ]; then
              echo "リポジトリ変数 $v が未設定。サーバーは起動を拒む"
              exit 1
            fi
          done
          if [ -z "${ALLOWED_ORIGINS}" ]; then
            echo "リポジトリ変数 ALLOWED_ORIGINS が未設定。画面のオリジンを入れること"
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/385680444543/locations/global/workloadIdentityPools/github/providers/liftplan-server
          service_account: github-deployer@liftplan-85309.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Artifact Registry に認証する
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # イメージのタグはコミットの SHA。どのリビジョンがどのコードかが
      # 後から辿れる。latest だけだと、ロールバックしたときに
      # 何に戻ったのか分からない。
      - name: ビルドして push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Cloud Run へデプロイ
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"

          # リビジョン名に短縮SHAを入れる。自動採番の 00004-fgj だけだと、
          # 一覧を見ても何のコードが動いているのか分からない。
          #
          # 実行番号を足すのは、同じコミットを出し直したときに名前が
          # 衝突してデプロイが失敗するため（再実行やロールバックで起きる）。
          SUFFIX="${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}"

          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --revision-suffix "${SUFFIX}" \
            --labels "commit=${GITHUB_SHA},run-id=${GITHUB_RUN_ID}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 --memory=512Mi \
            --set-secrets=DATABASE_URL=liftplan-database-url:latest,GITHUB_CLIENT_SECRET=liftplan-github-client-secret:latest,GOOGLE_CLIENT_SECRET=liftplan-google-client-secret:latest \
            --set-env-vars="ALLOWED_ORIGINS=${ALLOWED_ORIGINS},WEB_ORIGIN=${WEB_ORIGIN},API_ORIGIN=${API_ORIGIN},GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID},GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
            --allow-unauthenticated \
            --quiet

      # 出したものが本当に動いているかを確かめる。デプロイが
      # 成功しても、起動に失敗していれば意味がない。
      - name: 疎通を確認する
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --format='value(status.url)')
          echo "URL: ${URL}"

          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${URL}/health" || true)
            if [ "${code}" = "200" ]; then
              echo "ヘルスチェック: 200"
              break
            fi
            echo "  ${i}回目: ${code}"
            sleep 5
          done
          if [ "${code}" != "200" ]; then
            echo "ヘルスチェックが通らない"
            exit 1
          fi

          # 認証がかかっていることも確かめる。認証を壊したまま
          # 出してしまうと、ヘルスチェックだけでは気づけない。
          code=$(curl -s -o /dev/null -w '%{http_code}' "${URL}/api/program")
          if [ "${code}" != "401" ]; then
            echo "認証がかかっていない: ${code}"
            exit 1
          fi
          echo "認証: 401"

  # 画面は API のあとに出す。
  #
  # 逆順にすると「新しいクライアント → 古いサーバー」の窓ができる。
  # サーバーは DisallowUnknownFields なので、クライアントが増やした
  # フィールドは 400 で返り、待ち行列はそれを再送不能とみなして捨てる。
  # 記録が消える。同居させていた頃は成果物が1つで自動的に守られていた
  # 性質なので、分離した以上ここに明示する。
  web:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # pnpm の版は web/package.json の packageManager が唯一の出どころ。
      # 指定しないとリポジトリのルートを見に行くが、そこは Go のリポジトリで
      # package.json が無い。version: をここに書くと版が2箇所になってずれる。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      - name: ビルド
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -z "${VITE_API_BASE}" ]; then
            echo "リポジトリ変数 API_BASE が未設定。Cloud Run の URL を入れること"
            exit 1
          fi
          pnpm build

      - name: Cloudflare Workers へデプロイ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
